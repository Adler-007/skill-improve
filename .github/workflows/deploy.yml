name: Deploy to CloudBase Static Hosting

on:
  push:
    branches:
      - prod
  pull_request:
    branches:
      - prod
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  BUILD_DIR: dist
  CLOUDBASE_STATIC_PATH: /home

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}
          if-no-files-found: error

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ${{ env.BUILD_DIR }}

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli

      - name: Validate CloudBase secrets
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          if [ -z "$TCB_SECRET_ID" ]; then
            echo "::error::Missing GitHub Actions secret: TCB_SECRET_ID"
            exit 1
          fi

          if [ -z "$TCB_SECRET_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: TCB_SECRET_KEY"
            exit 1
          fi

          if [ -z "$TCB_ENV_ID" ]; then
            echo "::error::Missing GitHub Actions secret: TCB_ENV_ID"
            exit 1
          fi

          case "$TCB_SECRET_ID" in
            AKID*) ;;
            *)
              echo "::warning::TCB_SECRET_ID usually starts with AKID. Make sure this is the Tencent Cloud CAM SecretId, not a CloudBase environment ID or API key."
              ;;
          esac

      - name: Login CloudBase CLI
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy to CloudBase Static Hosting
        env:
          TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
        run: |
          tcb hosting deploy "./${BUILD_DIR}" "$CLOUDBASE_STATIC_PATH" -e "$TCB_ENV_ID"
